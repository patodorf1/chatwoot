name: Build & Deploy WeRecruitIT Chatwoot

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}:v4.11.2-wr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Pull new image and restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 178.104.76.151
          username: pato
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo docker pull ghcr.io/patodorf1/chatwoot:v4.11.2-wr
            sudo docker stop chatwoot-rails-in991thffe1h8450t3tud68q chatwoot-sidekiq-in991thffe1h8450t3tud68q || true
            sudo docker rm chatwoot-rails-in991thffe1h8450t3tud68q chatwoot-sidekiq-in991thffe1h8450t3tud68q || true
            cd /data/coolify/services/in991thffe1h8450t3tud68q && sudo docker compose up -d chatwoot-rails chatwoot-sidekiq
